extends: existence
message: "List items should start with a capitalized word."
level: warning
scope: raw
nonword: true

# Match lines starting with a Markdown list marker, followed by a lowercase letter.
# (?m) → multiline mode (so ^/$ match line starts/ends)
# [ ]{0,3} → allows up to 3 spaces indent
# [-*+] → unordered list bullets
# \d+\. → numbered lists (e.g., 1.)
# \s+ → space(s)
# [a-z] → lowercase first letter (what we want to flag)
tokens:
  - '(?m)^[ ]{0,3}(?:[-*+]|\d+\.)\s+[a-z]'
