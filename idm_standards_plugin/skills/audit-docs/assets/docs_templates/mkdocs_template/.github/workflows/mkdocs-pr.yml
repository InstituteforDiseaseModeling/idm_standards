name: MkDocs Build on PR

on:
  pull_request:
    branches: [ main ]  # Replace with your desired branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # full history required for git-revision-date-localized plugin

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install MkDocs and dependencies
      run: |
        pip install mkdocs mkdocs-material # Or your specific theme and plugins
        pip install -r docs/requirements.txt  # If you have a requirements.txt file

    - name: Build MkDocs site
      run: mkdocs build --strict

    - name: Upload built site
      uses: actions/upload-artifact@v4
      with:
        name: mkdocs-site-pr-${{ github.event.pull_request.number }}
        path: site/
        retention-days: 14
