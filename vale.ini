StylesPath = .github/styles
Vocab = IDM
MinAlertLevel = suggestion

# Packages = Microsoft, write-good
# ^ commenting out so only local changes are applied. 

[*.md]
# ^ This section applies to only Markdown files.
#
# You can change (or add) file extensions here
# to apply these settings to other file types.
#
# For example, to apply these settings to both
# Markdown and reStructuredText:
#
# [*.{md,rst}]
BasedOnStyles = IDM, Vale, Microsoft, write-good
Vale.Terms = NO
# ^ too many false positives with this rule

[*.ipynb] # exclude notebooks, many false positives
[.claude/**/*] # exclude claude skills
BasedOnStyles = Notebooks
# ^ This section only looks for links in notebook files. 
# Links are not well-handled and need counterintuitive 
# formatting to be parsed correctly.
