extends: substitution
message: "Prefer '%s' over '%s'."
level: warning
ignorecase: false
# Exclude headings so this rule doesn't fight Microsoft.Headings' sentence
# case. In a heading the first word stays capitalized (e.g. "Beta
# distribution"); mid-heading casing is handled by Microsoft.Headings.
# ~heading covers h2-h6; the first H1 is scoped heading.h1, so it must be
# excluded separately. The two negatives are AND-combined with `&`.
scope: ~heading
action:
  name: replace
swap:
  "(?:poisson)": Poisson
  "(?:boolean)": Boolean
  "(?:bayesian)": Bayesian
  "(?:Gamma)": gamma
  "(?:Beta)": beta
