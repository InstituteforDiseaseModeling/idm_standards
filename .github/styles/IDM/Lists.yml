# Vale rule: ListIndentation
# Catches common Markdown list formatting mistakes that cause list items or
# continuation text to render as plain paragraphs instead of list content.
#
# Compatible with: Quarto (.qmd), MkDocs Material (.md)
# Vale scope: raw  — operates on unprocessed Markdown source
#
# Place this file at: <your-styles-dir>/<YourStyle>/ListIndentation.yml
# Then reference it in .vale.ini:
#   [*.{md,qmd}]
#   YourStyle.ListIndentation = warning

extends: existence
message: "List formatting error: '%s' may break out of the list and render as a plain paragraph. Check indentation."
link: "https://spec.commonmark.org/0.31.2/#lists"
level: warning
scope: raw
raw:
  # NOTE: Vale concatenates all `raw:` entries into a single regex (no
  # separator). To check these patterns as alternatives, we open one
  # non-capturing alternation group here and close it at the end; each
  # pattern below is OR'd in with a leading `|`. The (?m) flag is hoisted
  # to the front so it applies to the whole expression.
  - '(?m)(?:'

  # -------------------------------------------------------------------------
  # PATTERN 1 — Continuation text not indented under a list item.
  #
  # Matches a list item line followed immediately by a non-empty line that:
  #   - does NOT start with whitespace (so it isn't a continuation or sub-list)
  #   - is NOT itself a list marker (-, *, +, or 1.)
  #   - is NOT a blank line, heading, fence, or blockquote
  #
  # Bad (second line renders as new paragraph):
  #   - First item
  #   This text should be indented to continue the item.
  #
  # Good:
  #   - First item
  #     This text is indented and stays inside the item.
  # -------------------------------------------------------------------------
  - '^[ \t]*[-*+][ \t]+.+\n(?![ \t]|[-*+][ \t]|\d+[.)]\s|>|#{1,6}\s|```|~~~|\s*$)(.+)'

  # -------------------------------------------------------------------------
  # PATTERN 2 — Ordered-list item followed by un-indented continuation text.
  #
  # Same idea as Pattern 1 but for numbered lists (1. 2. 10. etc.).
  #
  # Bad:
  #   1. First step
  #   More detail that should be indented.
  #
  # Good:
  #   1. First step
  #      More detail indented to column 4 (past "1. ").
  # -------------------------------------------------------------------------
  - '|^[ \t]*\d+[.)][ \t]+.+\n(?![ \t]|[-*+][ \t]|\d+[.)]\s|>|#{1,6}\s|```|~~~|\s*$)(.+)'

  # -------------------------------------------------------------------------
  # PATTERN 3 — Sub-list item indented by only one space.
  #
  # CommonMark requires sub-items to be indented past the first content
  # character of the parent item. One-space indent is almost always too
  # shallow and renders the sub-item as a new top-level list or paragraph.
  #
  # Bad (renders as top-level, not nested):
  #   - Parent item
  #    - Child item   ← only 1 space
  #
  # Good:
  #   - Parent item
  #     - Child item  ← 2+ spaces, past the "- " marker
  # -------------------------------------------------------------------------
  - '|^[ \t]*[-*+][ \t]+.+\n [-*+][ \t]'

  # NOTE: A "Pattern 4" for the blank-line/loose-list case was removed. By
  # regex alone it can't distinguish un-indented continuation text (a bug)
  # from a legitimate new paragraph after a list (the normal way to end a
  # list), so it produced false positives on nearly every list.

  # -------------------------------------------------------------------------
  # PATTERN 5 — List not preceded by a blank line.
  #
  # python-markdown (MkDocs) requires a blank line before a list. A list
  # marker immediately following a paragraph line is absorbed into that
  # paragraph and renders as plain text instead of a list.
  #
  # The preceding line is matched only if it is ordinary text — not itself a
  # list item, blank line, heading, blockquote, or code fence.
  #
  # Bad (list renders as part of the "Goals:" paragraph):
  #   Goals:
  #   - First goal
  #
  # Good:
  #   Goals:
  #
  #   - First goal
  # -------------------------------------------------------------------------
  - '|^(?![ \t]|[-*+][ \t]|\d+[.)][ \t]|>|#{1,6}\s|```|~~~|\s*$)(.+)\n(?:[-*+]|\d+[.)])[ \t]'

  # Close the alternation group opened at the top of `raw:`.
  - ')'
