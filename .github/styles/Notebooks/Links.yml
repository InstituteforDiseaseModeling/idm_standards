extends: existence
message: "Verify that the file path for links in notebooks include an extra '../' and remove the .md file extension for them to be correctly parsed."
level: warning
scope: raw
nonword: true

# Notes
# - (?s) enables DOTALL so '.' matches newlines in JSON.
# - We anchor the search to a Markdown cell to avoid code cells.
# - We match the first link inside the cell; Vale highlights the matched span.

tokens:
  # Link inside a Markdown cell: [text](url) or ![alt](url)
  - '(?s)"cell_type"[ \t]*:[ \t]*"markdown"[^\[]*?\[[^\]]+\]\([^)]+\)'
  # Autolink inside a Markdown cell: <http://...> or <https://...>
  - '(?s)"cell_type"[ \t]*:[ \t]*"markdown"[^\n]*?<https?://[^>]+>'
