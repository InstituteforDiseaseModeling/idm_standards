project:
  type: website
  output-dir: _site
  render: # Need to specify README.md explicitly since excluded by default
    - README.md
    - "*.md"
    - "*.ipynb"
    - "!docs_templates/"
    - "!idm_standards_plugin/"
    - "!evals/"
    - "idm_standards_plugin/README.md"

website:
  title: IDM Standards
  repo-url: https://github.com/InstituteforDiseaseModeling/idm_standards
  repo-actions: [issue]
  favicon: docs_guidance/images/favicon.ico
  page-footer:
    left: "Copyright &copy; 2026 Gates Foundation. All rights reserved."
    right:
      - text: "Privacy and Cookies Notice"
        href: https://www.gatesfoundation.org/Privacy-and-Cookies-Notice
      - text: "Terms of Use"
        href: https://www.gatesfoundation.org/Terms-of-Use
  navbar:
    logo: docs_guidance/images/idm-logo-transparent.png
    tools:
      - icon: github
        href: https://github.com/InstituteforDiseaseModeling/idm_standards
      - icon: envelope
        href: mailto:idm@gatesfoundation.org
      - icon: globe
        href: https://idmod.org
  sidebar:
    contents:
      - text: Home
        file: README.md
      - section: Getting started
        file: getting_started/index.md
        contents:
          - text: Installing Python
            file: getting_started/python.md
          - text: AI-assisted development
            file: getting_started/ai.md
          - text: Communication and culture
            file: getting_started/comms.md
      - section: Engineering guidance
        file: eng_guidance/index.md
        contents:
          - text: Philosophy
            file: eng_guidance/1_philosophy.md
          - text: Python
            file: eng_guidance/2_python.md
          - text: R
            file: eng_guidance/2b_r.md
          - text: Tests
            file: eng_guidance/3_tests.md
          - text: Documentation
            file: eng_guidance/4_documentation.md
          - text: Other
            file: eng_guidance/5_other.md
          - text: Zen
            file: eng_guidance/6_zen.md
          - text: Quality guidelines
            file: eng_guidance/engineering_quality_guidelines.md
      - section: Engineering processes
        file: eng_process/index.md
        contents:
          - text: GitHub
            file: eng_process/github.md
          - text: Processes
            file: eng_process/processes.md
          - text: Public release
            file: eng_process/public_release.md
      - section: Docs guidance
        file: docs_guidance/index.md
        contents:
          - text: MkDocs overview
            file: docs_guidance/mkdocs.md
          - text: Quarto overview
            file: docs_guidance/quarto.md
          - text: Style and grammar
            file: docs_guidance/style.md
          - section: Topic types and structure
            file: docs_guidance/topic-types/index.md
            contents:
              - section: Table of contents
                file: docs_guidance/topic-types/toc.md
                contents:
                  - text: Home page
                    file: docs_guidance/topic-types/home.md
                  - text: Installation
                    file: docs_guidance/topic-types/install.md
              - text: Tutorials
                file: docs_guidance/topic-types/tutorials.md
                contents:
                  - text: Example notebook
                    file: docs_guidance/topic-types/notebook.ipynb
              - text: How-to
                file: docs_guidance/topic-types/howto.md
              - text: Reference
                file: docs_guidance/topic-types/reference.md
              - text: Explanation
                file: docs_guidance/topic-types/explanation.md
          - section: Personas
            file: docs_guidance/personas/index.md
            contents:
              - text: Model builder
                file: docs_guidance/personas/model-builder.md
              - text: Model extender
                file: docs_guidance/personas/model-extender.md
              - text: Model user
                file: docs_guidance/personas/model-user.md
              - text: Policy influencer
                file: docs_guidance/personas/policy-influencer.md
              - text: Policy maker
                file: docs_guidance/personas/policy-maker.md
      - section: Claude plugins
        file: plugins_readme.md
        contents:
          - text: IDM-Standards plugin
            file: idm_standards_plugin/README.md

format:
  html:
    theme:
      light: cosmo
      dark: cyborg
    code-copy: true
    toc: true
    toc-expand: true
    toc-depth: 3
    highlight-style: github
    include-in-header:
      - docs_guidance/customization/analytics.html

execute:
  enabled: true
